; SmartClock AI — firmware custom para JUZIPi SD PRO (ESP8266 ESP-12F/12E)
; Pinout ST7789 da família SmallTV/Ultra (template ESPHome devices.esphome.io/devices/geekmagic-ultra/)
; MOSI=13 SCLK=14 CS=15 DC=0 RST=2 BL=5 (backlight ativo-BAIXO)

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_cpu = 80000000L
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	-D USER_SETUP_LOADED=1
	-D ST7789_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MOSI=13
	-D TFT_SCLK=14
	-D TFT_CS=15
	-D TFT_DC=0
	-D TFT_RST=2
	-D TFT_BL=5
	-D TFT_BACKLIGHT_ON=LOW
	-D SPI_FREQUENCY=40000000
	-D TFT_RGB_ORDER=TFT_BGR
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
